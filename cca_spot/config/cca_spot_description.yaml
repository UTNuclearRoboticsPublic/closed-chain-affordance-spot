/**:
  ros__parameters:

    # ----------------------------------------------------------
    # Core robot parameters
    # ----------------------------------------------------------

    cca_robot: "spot"                       # Robot name (package must be named cca_<robot>)
    cca_joint_states_topic: "/spot_driver/joint_states"
    rviz_fixed_frame: "base_footprint"      # RViz fixed frame from URDF

    # List of planning groups that will be loaded
    cca_planning_groups: ["arm", "mobile_body_and_arm"]

    # ----------------------------------------------------------
    # Planning group configuration
    # ----------------------------------------------------------
    cca_planning_group_info:

      # -----------------------------
      # Arm-only planning group
      # -----------------------------
      arm:
        ref_frame: arm0_base_link           # Reference frame for arm-only planning

        kinematic_chain:
          base_joint: arm0_shoulder_yaw
          end_joint: arm0_wrist_roll

        end_effector:
          frame: arm0_wrist_roll
          gripper_joint_name: arm0_fingers

        tool:
          frame: arm0_tool0
          offset_from_ee_frame: [0.19557, 0.0, 0.0]

        # Action servers for execution (robot or robot_and_gripper must be specified)
        robot_as: ""                        # Optional: pure arm trajectory AS
        gripper_as: ""                      # Optional: gripper-only AS
        robot_and_gripper_as: "/spot_moveit/arm_and_finger_controller/follow_joint_trajectory"

      # -----------------------------
      # Mobile Body and Arm planning group
      # -----------------------------
      mobile_body_and_arm:
        ref_frame: base_footprint           # Reference frame for whole-body planning

        kinematic_chain:
          base_joint: body_x
          end_joint: arm0_wrist_roll

        end_effector:
          frame: arm0_wrist_roll
          gripper_joint_name: arm0_fingers

        tool:
          frame: arm0_tool0
          offset_from_ee_frame: [0.19557, 0.0, 0.0]

        # Action servers for execution (robot or robot_and_gripper must be specified)
        robot_as: ""                        # Optional: body-only AS
        gripper_as: ""                      # Optional: gripper-only AS
        robot_and_gripper_as: "/spot_moveit/mobile_manipulation_controller/follow_joint_trajectory"

